on:
  push:
    branches: [main]

jobs:
  deploy-docs:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v4

      - uses: https://codeberg.org/johbo/sphinx-builder@v0.11.0

      - uses: actions/git-pages@v2
        with:
          site: "https://business-operations.codeberg.page/business-operations/"
          token: ${{ forge.token }}
          source: docs/_build/html/
