---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: policy
spec:
  loadBalancerIPs: true
  externalIPs: true
  interfaces:
    - ^eno.*
    - ^enp0s.*
    - ^enp1s.*
    - ^enp2s.*
    - ^eth.*
    - ^wlp.*
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  blocks:
    - cidr: "${cilium_pool_cidr}"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: static-pool
spec:
  blocks:
    - cidr: "${cilium_static_pool_cidr}"
  serviceSelector:
    matchLabels:
      ip-range: static-pool
