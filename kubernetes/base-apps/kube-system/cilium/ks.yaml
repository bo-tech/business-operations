---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-base-apps-cilium
  namespace: flux-system
spec:
  path: ./external/business-operations/kubernetes/base-apps/kube-system/cilium/app
  prune: false
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-base-apps-cilium-config
  namespace: flux-system
spec:
  path: ./external/business-operations/kubernetes/base-apps/kube-system/cilium/config
  prune: false
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cluster-base-apps-cilium
