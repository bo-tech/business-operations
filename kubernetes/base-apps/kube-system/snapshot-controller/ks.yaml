---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-base-apps-snapshot-controller
  namespace: flux-system
spec:
  interval: 10m
  timeout: 20m
  path: "./external/business-operations/kubernetes/base-apps/kube-system/snapshot-controller/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
  wait: true
