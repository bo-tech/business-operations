apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: registry
data:
  config.json: "{\n  \"distSpecVersion\": \"1.1.1\",\n  \"storage\": {\n    \"rootDirectory\": \"/var/lib/registry/store\",\n    \"dedupe\": false,\n    \"storageDriver\": {\n      \"name\": \"s3\",\n      \"rootdirectory\": \"/zot\",\n      \"region\": \"us-east-1\",\n      \"regionendpoint\": \"${zot_s3_endpoint}\",\n      \"bucket\": \"${zot_s3_bucket}\",\n      \"forcepathstyle\": true,\n      \"secure\": true\n    }\n  },\n  \"http\": {\n    \"address\": \"0.0.0.0\",\n    \"port\": \"5000\",\n    \"compat\": [\"docker2s2\"]\n  },\n  \"log\": {\n    \"level\": \"info\"\n  },\n  \"extensions\": {\n    \"sync\": {\n      \"enable\": true,\n      \"downloadDir\": \"/var/lib/registry/sync\",\n      \"registries\": [\n        {\n          \"urls\": [\"https://index.docker.io\"],\n          \"onDemand\": true,\n          \"preserveDigest\": true,\n          \"tlsVerify\": true,\n          \"content\": [{ \"prefix\": \"**\", \"destination\": \"/docker.io\" }]\n        },\n        {\n          \"urls\": [\"https://quay.io\"],\n          \"onDemand\": true,\n          \"preserveDigest\": true,\n          \"tlsVerify\": true,\n          \"content\": [{ \"prefix\": \"**\", \"destination\": \"/quay.io\" }]\n        },\n        {\n          \"urls\": [\"https://registry.k8s.io\"],\n          \"onDemand\": true,\n          \"preserveDigest\": true,\n          \"tlsVerify\": true,\n          \"content\": [{ \"prefix\": \"**\", \"destination\": \"/registry.k8s.io\" }]\n        },\n        {\n          \"urls\": [\"https://ghcr.io\"],\n          \"onDemand\": true,\n          \"preserveDigest\": true,\n          \"tlsVerify\": true,\n          \"content\": [{ \"prefix\": \"**\", \"destination\": \"/ghcr.io\" }]\n        },\n        {\n          \"urls\": [\"https://docker.gitea.com\"],\n          \"onDemand\": true,\n          \"preserveDigest\": true,\n          \"tlsVerify\": true,\n          \"content\": [{ \"prefix\": \"**\", \"destination\": \"/docker.gitea.com\" }]\n        },\n        {\n          \"urls\": [\"https://codeberg.org\"],\n          \"onDemand\": true,\n          \"preserveDigest\": true,\n          \"tlsVerify\": true,\n          \"content\": [{ \"prefix\": \"**\", \"destination\": \"/codeberg.org\" }]\n        }\n      ]\n    }\n  }\n}\n"
