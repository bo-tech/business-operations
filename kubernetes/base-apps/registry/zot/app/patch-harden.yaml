---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zot
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          emptyDir:
            # Staging holds every platform of every image syncing at
            # once, and an overrun evicts the pod (ADR-0048).
            sizeLimit: 25Gi
