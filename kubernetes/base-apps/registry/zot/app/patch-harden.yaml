---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zot
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          emptyDir:
            # Sync stages every layer here before it reaches S3, so
            # without a bound one large image fills the node.
            sizeLimit: 8Gi
