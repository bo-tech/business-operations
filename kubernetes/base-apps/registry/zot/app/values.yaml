---
image:
  # Arch-specific, not the chart's multi-arch `zot`: this reference is
  # pinned again in `business-operations.image-bundle`.
  repository: ghcr.io/project-zot/zot-linux-amd64
  tag: "v2.1.21@sha256:8258443838e95989c13c891f78a02bc1c391b5a00591ffef24cb8c17cde28038"

service:
  # The chart defaults to NodePort, which would put the mirror on every
  # node's address. Reaching it from outside is the gateway component's job.
  type: ClusterIP
  clusterIP: "10.96.0.30"
  port: 5000

# config.json arrives through render.sh's --set-file, not from here.
mountConfig: true

persistence: false

strategy:
  type: Recreate

env:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: zot-s3
        key: s3_access_key_id
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: zot-s3
        key: s3_access_key_secret
