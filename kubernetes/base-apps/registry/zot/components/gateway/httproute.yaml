---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zot
  namespace: registry
spec:
  parentRefs:
    - name: internal
      namespace: network
  hostnames:
    - "mirror.${cluster_domain}"
  rules:
    # No ForwardAuth: containerd cannot authenticate through Authelia,
    # and the mirror serves public image data read-only.
    - backendRefs:
        - name: zot
          port: 5000
