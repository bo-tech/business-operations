---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/data-gitlab-postgresql-0

components:
  - ../../../../../../../../external/business-operations/kubernetes/components/volume/restore-volsync

patches:
  - target:
      kind: ReplicationDestination
      group: volsync.backube
    patch: |
      kind: ReplicationDestination
      metadata:
        name: not-used
      spec:
        restic:
          moverSecurityContext:
            runAsUser: 1001
