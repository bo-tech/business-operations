---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-base-apps-gitlab-volumes
  namespace: flux-system
spec:
  interval: 10m
  path: "./external/business-operations/kubernetes/base-apps/gitlab/gitlab-volumes/overlays/${cluster_bootstrap_mode}"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
  dependsOn:
    - name: cluster-base-apps-external-secrets-store
