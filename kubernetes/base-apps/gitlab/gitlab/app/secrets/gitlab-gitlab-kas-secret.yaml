apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-gitlab-kas-secret
  namespace: gitlab
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: gitlab-gitlab-kas-secret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: kas_shared_secret
      remoteRef:
        key: apps/gitlab/gitlab-kas-secret
        property: kas_shared_secret
