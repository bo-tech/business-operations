apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-registry-httpsecret
  namespace: gitlab
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: gitlab-registry-httpsecret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: secret
      remoteRef:
        key: apps/gitlab/registry-httpsecret
        property: secret
