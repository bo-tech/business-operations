---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - ./gateway.yaml

configMapGenerator:
  - name: traefik-internal-git-pages-values
    files:
      - values.yaml=./values.yaml

patches:
  - target:
      kind: HelmRelease
      name: traefik-internal
    patch: |-
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: traefik-internal-git-pages-values
