providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: false
  kubernetesGateway:
    enabled: true
    labelSelector: local/gateway-role=internal

gatewayClass:
  enabled: true
  name: internal
  labels:
    local/gateway-role: internal

gateway:
  enabled: true
  name: internal
  listeners:
    web:
      port: 8000
      protocol: HTTP
      namespacePolicy:
        from: All

ingressClass:
  enabled: false

ingressRoute:
  dashboard:
    enabled: false

service:
  type: LoadBalancer
  annotations:
    lbipam.cilium.io/ips: "${cluster_internal_traefik_ip}"
    # Forgejo's SSH Service takes port 22 on this address. See ADR-0044.
    lbipam.cilium.io/sharing-key: internal-traefik
    lbipam.cilium.io/sharing-cross-namespace: code
  labels:
    ip-range: static-pool
  additionalServices:
    git-pages:
      annotations:
        lbipam.cilium.io/ips: "${cluster_git_pages_ip}"
      labels:
        ip-range: static-pool

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    # The 60s default bounds the whole request and cuts off a large
    # git push. See ADR-0042.
    transport:
      respondingTimeouts:
        readTimeout: 3600s
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    transport:
      respondingTimeouts:
        readTimeout: 3600s

  git-pages:
    port: 8444
    expose:
      default: false
      git-pages: true
    exposedPort: 443

logs:
  general:
    level: INFO
  access:
    enabled: true
    format: json

resources:
  requests:
    cpu: 10m
    memory: 50Mi
