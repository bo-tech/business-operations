---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: 4.14.0
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
      interval: 30m
  values:
    controller:
      enableHttps: false
      config:
        allow-snippet-annotations: "true"
        annotations-risk-level: Critical
        global-auth-method: GET
        global-auth-url: http://authelia.security.svc.cluster.local/api/verify
        global-auth-signin: https://auth.${cluster_domain}?rm=$request_method
        global-auth-response-headers: "Remote-User,Remote-Name,Remote-Groups,Remote-Email"
        global-allowed-response-headers: "Cache-Control,Pragma,X-Frame-Options,X-XSS-Protection"
        global-auth-snippet: |
          proxy_set_header X-Forwarded-Method $request_method;
      service:
        annotations:
          lbipam.cilium.io/ips: "${cluster_ingress_ip}"
        labels:
          ip-range: static-pool

          # NOTE: This is vital to ensure that the L2 Announcements of the
          # Cilium VIP work.
          #
          # See: https://docs.cilium.io/en/v1.16/network/l2-announcements/
          externalTrafficPolicy: Cluster

        type: "LoadBalancer"
      extraArgs:
        default-ssl-certificate: "cert-manager/wildcard-tls-secret"
