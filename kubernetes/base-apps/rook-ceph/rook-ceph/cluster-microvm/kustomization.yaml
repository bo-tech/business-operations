---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../cluster

patches:
  - target:
      kind: HelmRelease
      name: rook-ceph-cluster
    patch: |
      - op: add
        path: /spec/valuesFrom/-
        value:
          kind: ConfigMap
          name: rook-ceph-cluster-values-microvm

configMapGenerator:
  - name: rook-ceph-cluster-values-microvm
    files:
      - values.yaml=./values.yaml
