cephClusterSpec:
  cephConfig:
    global:
      osd_pool_default_size: "1"
  mon:
    count: 1
    allowMultiplePerNode: true
  mgr:
    count: 1
  storage:
    # Two branches: a disko partition, or a microVM's whole raw disk
    devicePathFilter: "^(/dev/disk/by-partlabel/disk-disk1-data|/dev/vd[b-z])$"
  resources:
    mgr:
      requests:
        cpu: 1m
        memory: 1Mi
    mon:
      requests:
        cpu: 1m
        memory: 1Mi
    osd:
      requests:
        cpu: 1m
        memory: 1Mi
    mgr-sidecar:
      requests:
        cpu: 1m
        memory: 1Mi
    prepareosd:
      requests:
        cpu: 1m
        memory: 1Mi
    cleanup:
      requests:
        cpu: 1m
        memory: 1Mi
    crashcollector:
      requests:
        cpu: 1m
        memory: 1Mi
    exporter:
      requests:
        cpu: 1m
        memory: 1Mi
    logcollector:
      requests:
        cpu: 1m
        memory: 1Mi

cephBlockPools:
  - name: ceph-blockpool
    spec:
      failureDomain: osd
      replicated:
        size: 1
    storageClass:
      enabled: true
      name: ceph-block
      isDefault: true
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: Immediate
      parameters:
        imageFormat: "2"
        imageFeatures: layering
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
        csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
        csi.storage.k8s.io/fstype: ext4

cephFileSystems:
  - name: ceph-filesystem
    spec:
      metadataPool:
        replicated:
          size: 1
      dataPools:
        - failureDomain: osd
          replicated:
            size: 1
          name: data0
      metadataServer:
        activeCount: 1
        activeStandby: false
        resources:
          requests:
            cpu: 1m
            memory: 1Mi
    storageClass:
      enabled: true
      isDefault: false
      name: ceph-filesystem
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: Immediate
      parameters:
        csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
        csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
        csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
        csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
        csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
        csi.storage.k8s.io/fstype: ext4

cephObjectStores: []
