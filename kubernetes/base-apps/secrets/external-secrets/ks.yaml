---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-base-apps-external-secrets
  namespace: flux-system
spec:
  interval: 10m
  path: "./external/business-operations/kubernetes/base-apps/secrets/external-secrets/app"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-base-apps-external-secrets-store
  namespace: flux-system
spec:
  interval: 10m
  path: "./external/business-operations/kubernetes/base-apps/secrets/external-secrets/store"
  prune: true
  wait: true
  dependsOn:
    - name: cluster-base-apps-external-secrets
    - name: cluster-base-apps-vault
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
