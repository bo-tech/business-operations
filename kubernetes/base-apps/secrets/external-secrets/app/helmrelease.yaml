---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      version: 1.1.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: external-secrets-io
        namespace: flux-system

  values:
    installCRDs: false
