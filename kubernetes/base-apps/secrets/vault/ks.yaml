---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-base-apps-vault
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 5m
  timeout: 5m
  path: "./external/business-operations/kubernetes/base-apps/secrets/vault/app"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
  dependsOn:
    - name: cluster-base-apps-vault-volumes
    - name: cluster-base-apps-ingress-nginx
