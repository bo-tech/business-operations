---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-base-apps-traefik-external
  namespace: flux-system
spec:
  interval: 30m
  path: "./external/business-operations/kubernetes/base-apps/network-external/traefik/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
  wait: true
  dependsOn:
    - name: cluster-crds-gateway-api
