---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-mayan-edms
  namespace: flux-system
spec:
  path: ./external/business-operations/kubernetes/apps/default/mayan-edms/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cluster-apps-mayan-edms-db
    - name: cluster-apps-mayan-edms-volumes
