---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mayan-db
  namespace: default
  annotations:
    cnpg.local/backup-revision: "v1"
    cnpg.local/restore-revision: "v1"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:15.4-10
  storage:
    size: 10Gi
    storageClass: "ceph-block"
  bootstrap:
    initdb:
      database: mayan
      owner: mayan
      secret:
        name: mayan-db-app
