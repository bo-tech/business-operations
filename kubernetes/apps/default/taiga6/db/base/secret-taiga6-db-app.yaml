---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: taiga6-db-app
  namespace: default
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: taiga6-db-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: apps/taiga6/db
        property: username
    - secretKey: password
      remoteRef:
        key: apps/taiga6/db
        property: password
    - secretKey: pgpass
      remoteRef:
        key: apps/taiga6/db
        property: pgpass
