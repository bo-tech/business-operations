---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: taiga6-db
  namespace: default
  annotations:
    cnpg.local/backup-revision: "v2"
    cnpg.local/restore-revision: "v2"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:15.4-10
  storage:
    size: 5Gi
    storageClass: "ceph-block"
  bootstrap:
    initdb:
      database: taiga6
      owner: taiga6
      secret:
        name: taiga6-db-app
