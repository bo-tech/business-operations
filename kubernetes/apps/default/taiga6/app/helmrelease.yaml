---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: taiga
  namespace: default
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: taiga/helm/taiga
      version: 0.0.12-pre-taiga6-helm-chart
      sourceRef:
        kind: HelmRepository
        name: local-bv-charts
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
    disableHooks: false
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    disableHooks: false
  uninstall:
    keepHistory: false

  valuesFrom:
    - kind: Secret
      name: taiga6-db-app
      valuesKey: username
      targetPath: postgresql.auth.username
    - kind: Secret
      name: taiga6-db-app
      valuesKey: password
      targetPath: postgresql.auth.password


  values:

    publicRegisterEnabled: false
    createInitialUser: false

    gateway:
      enabled: true

    ingress:
      annotations:
        hajimari.io/enable: "true"
      hostname: "taiga.${cluster_domain}"
      tls: true
      secretName: ""

    persistence:
      static:
        existingClaim: taiga-static
      media:
        existingClaim: taiga-media

    # TODO: Remove once Taiga chart ships current Bitnami images.
    # Bitnami moved old tags from docker.io/bitnami/ to bitnamilegacy/.
    async-rabbitmq:
      image:
        registry: docker.io
        repository: bitnamilegacy/rabbitmq

    events-rabbitmq:
      image:
        registry: docker.io
        repository: bitnamilegacy/rabbitmq

    postgresql:
      enabled: false
      host: "taiga6-db-rw"
      auth:
        database: "taiga6"
