---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default

resources:
  - ./taiga-media
  - ./taiga-static

patches:
  - target:
      kind: ReplicationDestination
      group: volsync.backube
    patch: |
      kind: ReplicationDestination
      metadata:
        name: not-used
      spec:
        restic:
          moverSecurityContext:
            runAsUser: 999
