env:
  TZ: Europe/Berlin
hajimari:
  title: Apps
  darkTheme: espresso
  lightTheme: cloud
  alwaysTargetBlank: true
  showGreeting: true
  showAppGroups: true
  showAppStatus: false
  showBookmarkGroups: true
  showGlobalBookmarks: false
  showAppUrls: false
  defaultEnable: false
  namespaceSelector:
    matchNames:
      - default
      - flux-system
      - kube-system
      - monitoring
      - network
      - rook-ceph
      - secrets
      - security
  # Hajimari discovers from Ingress only, so an app on an HTTPRoute is
  # listed here instead. See ADR-0038.
  customApps:
    - group: security
      apps:
        - name: Authelia
          url: https://auth.${cluster_domain}

ingress:
  main:
    enabled: true
    ingressClassName: nginx
    hosts:
      - host: &host apps.${cluster_domain}
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - *host
persistence:
  data:
    enabled: true
    type: emptyDir
resources:
  requests:
    cpu: 100m
    memory: 128M
