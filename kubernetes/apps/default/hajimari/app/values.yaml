env:
  TZ: Europe/Berlin
hajimari:
  title: Apps
  darkTheme: espresso
  lightTheme: cloud
  alwaysTargetBlank: true
  showGreeting: true
  showAppGroups: true
  showAppStatus: false
  showBookmarkGroups: true
  showGlobalBookmarks: false
  showAppUrls: false
  defaultEnable: false
  namespaceSelector:
    matchNames:
      - default
      - flux-system
      - kube-system
      - monitoring
      - network
      - rook-ceph
      - secrets
      - security
  # Hajimari discovers from Ingress only, so an app on an HTTPRoute is
  # listed here instead. See ADR-0038.
  customApps:
    - group: default
      apps:
        - name: Mayan EDMS
          url: https://mayan.${cluster_domain}
        - name: Taiga
          url: https://taiga.${cluster_domain}
        - name: Tryton
          url: https://tryton.${cluster_domain}
    - group: security
      apps:
        - name: Authelia
          url: https://auth.${cluster_domain}
        - name: LLDAP
          url: https://lldap.${cluster_domain}
    - group: monitoring
      apps:
        - name: Grafana
          url: https://grafana.${cluster_domain}
        - name: Prometheus
          url: https://prometheus.${cluster_domain}

persistence:
  data:
    enabled: true
    type: emptyDir
resources:
  requests:
    cpu: 100m
    memory: 128M
