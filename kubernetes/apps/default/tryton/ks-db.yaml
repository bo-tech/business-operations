---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-tryton-db
  namespace: flux-system
spec:
  path: ./external/business-operations/kubernetes/apps/default/tryton/db/overlays/${cluster_bootstrap_mode}
  prune: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cluster-apps-cloudnative-pg
