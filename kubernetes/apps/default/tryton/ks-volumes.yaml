---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-tryton-volumes
  namespace: flux-system
spec:
  interval: 10m
  path: ./external/business-operations/kubernetes/apps/default/tryton/volumes/overlays/${cluster_bootstrap_mode}
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
