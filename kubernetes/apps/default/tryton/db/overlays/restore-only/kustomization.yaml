---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default

resources:
  - ../../base

components:
  - ../../../../../../components/cnpg-cluster/restore

patches:
  - target:
      kind: Cluster
      group: postgresql.cnpg.io
    patch: |
      - op: replace
        path: /spec/bootstrap
        value:
          recovery:
            source: restore
            database: tryton
            owner: tryton
            secret:
              name: tryton-db-v2-app
