---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/data-unifi

components:
  - ../../../../../../../components/volume/backup-volsync
  - ../../../../../../../components/volume/restore-volsync

patches:
  - patch: |-
      - op: replace
        path: /spec/trigger/schedule
        value: "20 0/3 * * *"
    target:
      group: volsync.backube
      kind: ReplicationSource
