image:
  repository: jacobalberty/unifi
  tag: v9.5.21@sha256:e21d932b36ceca1f3cfadb021f207016659bc8f7a59cd1b0d6ecf7ecd7067383

env:
  TZ: "Europe/Berlin"
  RUNAS_UID0: "false"
  UNIFI_UID: "999"
  UNIFI_GID: "999"
  UNIFI_STDOUT: "true"
  JVM_INIT_HEAP_SIZE:
  JVM_MAX_HEAP_SIZE: 1024M

ingress:
  main:
    enabled: true
    annotations:
      hajimari.io/enable: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    ingressClassName: nginx
    hosts:
      - host: &host unifi.${cluster_domain}
        paths:
          - path: /
    tls:
      - hosts:
          - *host

service:
  main:
    type: LoadBalancer
    annotations:
      lbipam.cilium.io/ips: "${unifi_ip}"
    labels:
      ip-range: static-pool
    externalTrafficPolicy: Cluster
    ports:
      http:
        port: 8443
        protocol: HTTPS
      controller:
        enabled: true
        port: 8080
        protocol: TCP
      portal-http:
        enabled: false
        port: 8880
        protocol: HTTP
      portal-https:
        enabled: false
        port: 8843
        protocol: HTTPS
      speedtest:
        enabled: true
        port: 6789
        protocol: TCP
      stun:
        enabled: true
        port: 3478
        protocol: UDP
      syslog:
        enabled: true
        port: 5514
        protocol: UDP
      discovery:
        enabled: true
        port: 10001
        protocol: UDP
  ui:
    enabled: true
    type: ClusterIP
    ports:
      ui:
        enabled: true
        primary: true
        port: 8081

configMaps:
  nginx:
    enabled: true
    data:
      default.conf: |
        map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
        }

        server {
            listen 8081;
            server_tokens off;
            client_max_body_size 0;

            location / {
                proxy_pass https://127.0.0.1:8443;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }

sidecars:
  nginx:
    image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
    volumeMounts:
      - name: nginx-config
        mountPath: /etc/nginx/conf.d
        readOnly: true
      - name: nginx-tmp
        mountPath: /tmp
      - name: nginx-cache
        mountPath: /var/cache/nginx
    resources:
      requests:
        cpu: 1m
        memory: 16Mi
      limits:
        memory: 32Mi

persistence:
  data:
    enabled: true
    type: pvc
    existingClaim: data-unifi
    mountPath: /unifi
  nginx-config:
    enabled: true
    type: configMap
    name: '{{ .Release.Name }}-nginx'
    mountPath: "-"
  nginx-tmp:
    enabled: true
    type: emptyDir
    mountPath: "-"
  nginx-cache:
    enabled: true
    type: emptyDir
    mountPath: "-"

resources:
  requests:
    memory: 750Mi
    cpu: 15m
  limits:
    memory: 1250Mi
