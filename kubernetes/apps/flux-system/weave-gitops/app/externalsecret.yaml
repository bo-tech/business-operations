---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weave-gitops-secrets
  namespace: flux-system
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: weave-gitops-secrets
    creationPolicy: Owner
  data:
    - secretKey: password_hash
      remoteRef:
        key: apps/weave-gitops/admin-user
        property: password_hash
