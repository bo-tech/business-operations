---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: weave-gitops
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: weave-gitops
      version: 4.0.36
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: weave-gitops
  values:
    logLevel: info

    adminUser:
      create: true
      username: &admin_user admin

    networkPolicy:
      create: false

    metrics:
      enabled: true

    rbac:
      create: true
      impersonationResourceNames:
        - *admin_user
      additionalRules:
        - apiGroups:
            - "infra.contrib.fluxcd.io"
          resources:
            - "terraforms"
          verbs:
            - "get"
            - "list"
            - "patch"

  valuesFrom:
    - kind: Secret
      name: weave-gitops-secrets
      valuesKey: password_hash
      targetPath: adminUser.passwordHash
