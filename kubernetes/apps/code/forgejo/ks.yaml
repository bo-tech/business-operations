---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-forgejo
  namespace: flux-system
spec:
  path: ./external/business-operations/kubernetes/apps/code/forgejo/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cluster-apps-forgejo-db
    - name: cluster-apps-forgejo-volumes

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-forgejo-db
  namespace: flux-system
spec:
  path: ./external/business-operations/kubernetes/apps/code/forgejo/db/overlays/${cluster_bootstrap_mode}
  prune: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cluster-apps-cloudnative-pg

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-forgejo-volumes
  namespace: flux-system
spec:
  interval: 10m
  path: ./external/business-operations/kubernetes/apps/code/forgejo/volumes/overlays/${cluster_bootstrap_mode}
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
