---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-forgejo
  namespace: flux-system
spec:
  path: ./external/business-operations/kubernetes/apps/code/forgejo/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
