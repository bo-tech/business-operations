---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-forgejo
  namespace: flux-system
spec:
  path: ./external/business-operations/kubernetes/apps/code/forgejo/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-forgejo-db
  namespace: flux-system
spec:
  # TODO: Work in backup and restore
  path: ./external/business-operations/kubernetes/apps/code/forgejo/db/overlays/none
  # path: ./external/business-operations/kubernetes/apps/code/forgejo/db/overlays/${cluster_bootstrap_mode}
  prune: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cluster-apps-cloudnative-pg
