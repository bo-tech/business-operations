image:
  tag: 14.0.2-rootless
  digest: sha256:5552c9e25f353760420b8ac7a7f0f0a788ff571bbfd8e2c1e93503d3e2e1b87a

gitea:
  admin:
    existingSecret: forgejo-admin
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  config:
    repository:
      DEFAULT_REPO_UNITS: "repo.code,repo.releases,repo.pulls,repo.packages,repo.actions"
      DEFAULT_FORK_REPO_UNITS: "repo.code,repo.releases,repo.pulls"
      DEFAULT_MIRROR_REPO_UNITS: "repo.code,repo.releases"
    server:
      DOMAIN: code.${cluster_domain}
      ROOT_URL: https://code.${cluster_domain}
    service:
      DISABLE_REGISTRATION: true
    session:
      PROVIDER: db
    database:
      DB_TYPE: postgres
      HOST: forgejo-db-v1-rw
      NAME: app
      USER: app

service:
  # Cilium refuses the shared address unless traefik-internal's own
  # annotations and traffic policy agree. See ADR-0044.
  ssh:
    type: LoadBalancer
    externalTrafficPolicy: Cluster
    annotations:
      lbipam.cilium.io/ips: "${cluster_internal_traefik_ip}"
      lbipam.cilium.io/sharing-key: internal-traefik
      lbipam.cilium.io/sharing-cross-namespace: network
    labels:
      ip-range: static-pool

persistence:
  enabled: true
  create: false
  claimName: forgejo-data

httpRoute:
  enabled: true
  parentRefs:
    - name: internal
      namespace: network
  hostnames:
    - code.${cluster_domain}
