---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-lldap
  namespace: flux-system
spec:
  interval: 30m
  path: "./external/business-operations/kubernetes/apps/security/lldap/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
  dependsOn:
    - name: cluster-apps-lldap-volumes

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-lldap-volumes
  namespace: flux-system
spec:
  interval: 30m
  path: "./external/business-operations/kubernetes/apps/security/lldap/volumes/overlays/${cluster_bootstrap_mode}"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
