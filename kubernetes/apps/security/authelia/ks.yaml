---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-authelia
  namespace: flux-system
spec:
  interval: 30m
  path: "./external/business-operations/kubernetes/apps/security/authelia/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
  wait: false
  dependsOn:
    - name: cluster-apps-authelia-volumes
    - name: cluster-apps-lldap

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-authelia-volumes
  namespace: flux-system
spec:
  interval: 30m
  path: "./external/business-operations/kubernetes/apps/security/authelia/volumes/overlays/${cluster_bootstrap_mode}"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
