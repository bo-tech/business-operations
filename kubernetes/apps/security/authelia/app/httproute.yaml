---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: security
spec:
  parentRefs:
    - name: internal
      namespace: network
  hostnames:
    - "auth.${cluster_domain}"
  rules:
    # No ForwardAuth filter: this is the route that serves the login.
    - backendRefs:
        - name: authelia
          port: 80
