---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps-renovate
  namespace: flux-system
spec:
  interval: 10m
  path: ./external/business-operations/kubernetes/apps/gitlab/renovate/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: bv-ops-kubernetes
  wait: false
