---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: echo-server
  namespace: network
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 1.5.1
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system

  values:
    image:
      repository: ghcr.io/mendhak/http-https-echo
      tag: "38@sha256:c73e039e883944a38e37eaba829eb9a67641cd03eff868827683951feceef96e"

    env:
      HTTP_PORT: &port 8080
      LOG_WITHOUT_NEWLINE: "true"
      LOG_IGNORE_PATH: "/healthz"

    service:
      main:
        ports:
          http:
            port: *port

    # [docs-hajimari-example]
    ingress:
      main:
        enabled: true
        ingressClassName: "nginx"
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/appName: "Echo Server"
        hosts:
          - host: &host "echo-server.${cluster_domain}"
            paths:
              - path: /
        tls:
          - hosts:
              - *host
    # [docs-hajimari-example]

    resources:
      requests:
        cpu: 5m
        memory: 30M
      limits:
        memory: 30M
