---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: registry-mirror-alert
spec:
  groups:
    - name: registry-mirror
      rules:
        # Losing the pod kills every sync in flight, and zot does not
        # retry them. The images it was fetching stay missing from the
        # store until something pulls them again, which is why this is
        # worth an alert rather than a restart count (ADR-0048).
        - alert: RegistryMirrorEvicted
          annotations:
            summary: Registry mirror {{ $labels.pod }} was evicted, losing syncs in flight
          expr: kube_pod_status_reason{namespace="registry", reason="Evicted"} == 1
          labels:
            severity: critical
        - alert: RegistryMirrorRestarted
          annotations:
            summary: Registry mirror {{ $labels.pod }} restarted, losing syncs in flight
          expr: increase(kube_pod_container_status_restarts_total{namespace="registry", container="zot"}[1h]) > 0
          labels:
            severity: warning
