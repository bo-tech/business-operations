---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: bv-ops-kubernetes
  namespace: flux-system
spec:
  interval: 30m
  recurseSubmodules: true
  ref:
    branch: main
  url: http://gitea-http.flux-bootstrap.svc.cluster.local/bootstrap/b-ops.git
  ignore: |
    # exclude all
    /*
    # include gitops dirs
    !/kubernetes
    !/external/business-operations/kubernetes
