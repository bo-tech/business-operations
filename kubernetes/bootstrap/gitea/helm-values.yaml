---
gitea:
  admin:
    existingSecret: gitea-bootstrap-secret
  metrics:
    enabled: true
  config:
    server:
      HTTP_PORT: 3000
    database:
      DB_TYPE: sqlite3
    session:
      PROVIDER: memory
    cache:
      ADAPTER: memory
    queue:
      TYPE: level
    webhook:
      ALLOWED_HOST_LIST: >-
        *.flux-system.svc.cluster.local

valkey-cluster:
  enabled: false
postgresql:
  enabled: false
postgresql-ha:
  enabled: false

service:
  http:
    type: ClusterIP
    port: 80
    clusterIP:

ingress:
  enabled: false

persistence:
  enabled: true
  storageClass: "openebs-hostpath"
  size: 2Gi
